services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: citebench
      POSTGRES_PASSWORD: citebench
      POSTGRES_DB: citebench
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/00-langfuse.sh:/docker-entrypoint-initdb.d/00-langfuse.sh:ro
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citebench -d citebench"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://citebench:citebench@db:5432/citebench
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      FLASHRANK_CACHE_DIR: ${FLASHRANK_CACHE_DIR:-/tmp/flashrank}
      CONFIG_PATH: /app/config.yaml
      CORPUS_DIR: /app/corpus
      TRACE_STORE_DIR: /tmp/citebench-traces
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./corpus:/app/corpus
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: http://api:8000
    depends_on:
      - api

  # Optional self-hosted Langfuse (v2, Postgres-backed). Cloud keys also work
  # without this service: set LANGFUSE_PUBLIC_KEY/SECRET_KEY/HOST on `api`.
  #   docker compose --profile langfuse up --build
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["langfuse"]
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://citebench:citebench@db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-citebench-nextauth-secret}
      SALT: ${LANGFUSE_SALT:-citebench-langfuse-salt}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: citebench
      LANGFUSE_INIT_ORG_NAME: Citebench
      LANGFUSE_INIT_PROJECT_ID: citebench
      LANGFUSE_INIT_PROJECT_NAME: Citebench
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-citebench-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-citebench-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-dev@citebench.local}
      LANGFUSE_INIT_USER_NAME: Citebench
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-citebenchdev}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
