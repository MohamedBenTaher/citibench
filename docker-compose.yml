services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: citebench
      POSTGRES_PASSWORD: citebench
      POSTGRES_DB: citebench
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citebench -d citebench"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://citebench:citebench@db:5432/citebench
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      CONFIG_PATH: /app/config.yaml
      CORPUS_DIR: /app/corpus
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./corpus:/app/corpus
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
