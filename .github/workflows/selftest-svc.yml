name: selftest-svc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citebench
          POSTGRES_PASSWORD: citebench
          POSTGRES_DB: citebench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citebench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - run: echo services ok
