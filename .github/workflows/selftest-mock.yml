name: selftest-mock

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"

      - name: Install
        run: uv sync --frozen

      - name: Pytest
        env:
          PYTHONPATH: apps/api
        run: python -m pytest apps/api

      - name: Web typecheck
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Typecheck web
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Forbid createServerFn reads
        working-directory: apps/web
        run: |
          if grep -rn "createServerFn" src --include="*.ts" --include="*.tsx" | grep -v "Do not wrap GET loaders in createServerFn"; then
            echo "createServerFn usage found — reads must use fetchApiJson" >&2
            exit 1
          fi

      - name: RAGAS CI gate (mock)
        env:
          EVAL_STORE_DIR: ${{ github.workspace }}/evals/results
          TRACE_STORE_DIR: ${{ runner.temp }}/citebench-traces
        run: |
          python -m citebench.eval.ci \
            --split evals/splits/ci.jsonl \
            --known-bad evals/splits/known_bad.jsonl \
            --threshold-faithfulness 0.7 \
            --mock \
            --store-dir evals/results

      - name: Redteam (C8, mock)
        env:
          EVAL_STORE_DIR: ${{ github.workspace }}/evals/results
          TRACE_STORE_DIR: ${{ runner.temp }}/citebench-traces
        run: |
          python -m citebench.eval.redteam \
            --split evals/redteam.jsonl \
            --mock \
            --store-dir evals/results

      - name: Upload last eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-latest
          path: evals/results/latest.json
          if-no-files-found: warn

  # Exposes whether the Groq secret is configured. Secrets cannot be used in a
  # job-level `if`, so the live job depends on this output.
