provider: groq
embed_model: nomic-embed-text-v1.5
embed_dimensions: 768
# Same 768-d nomic weights. Groq hosted them, then 404'd (model_not_found).
# local = ONNX via fastembed (default). groq_then_local = historical probe
# for hosted nomic (Groq 404s; kept for tests / rollback).
embed_backend: local
# No second billed embed provider.
embed_api_base: https://api.groq.com/openai/v1
# nomic-embed-text-v1.5 prefixes (model card). Applied before the embed call.
embed_document_prefix: "search_document: "
embed_query_prefix: "search_query: "
# Reranker (FlashRank): TinyBERT-L-2 measures better AND ~7x faster than
# MiniLM-L-12-Q on the committed qrels (plan 023: recall@8 0.923 vs 0.904,
# nDCG@8 0.769 vs 0.692, rerank ~0.1 s vs ~2.2 s at pool 50).
rerank_model: ms-marco-TinyBERT-L-2-v2
chunk_size: 512
chunk_overlap: 64
# Chunk-boundary tokenizer: tiktoken cl100k_base. Deterministic across re-index.
# Used only to slice passages. Embeddings are nomic-embed-text-v1.5 (local ONNX).
tokenizer: cl100k_base
# Contract C retrieve knobs. Aliases: vector_k=dense_k, fts_k=lexical_k,
# rerank_input_k=rerank_pool.
rrf_k: 60
dense_k: 50
lexical_k: 50
rerank_pool: 50
top_k: 8
# C6 RAGAS CI gate (python -m citebench.eval.ci). Not a published score.
# C7 /metrics quotes the last eval artifact and records its mode (mock|live).
faithfulness_threshold: 0.7
# Groq production chat id (https://console.groq.com/docs/models). Override with GROQ_CHAT_MODEL.
# llama-3.1-8b-instant is enterprise-only after 2026-08-16; developer keys 404.
chat_model: openai/gpt-oss-20b
# Pre-LLM abstain when FlashRank ran and the top hit score is below this.
# Skipped when rerank_skipped=true (RRF scores are not on the same scale).
abstain_min_score: 0.12
# citebench.cost.v1 estimate table. Not a Groq invoice. Override in env if needed.
# openai/gpt-oss-20b published developer rates; nomic embed is a local table value.
chat_prompt_usd_per_1m: 0.075
chat_completion_usd_per_1m: 0.30
embed_usd_per_1m: 0.01
