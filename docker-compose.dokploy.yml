# Citebench on Dokploy — self-contained Compose (api + web + pgvector db).
#
# Dokploy setup
#   1. Create Service → Compose
#   2. Compose Path: docker-compose.dokploy.yml
#   3. Environment tab, set:
#        POSTGRES_PASSWORD=<pick one>
#        POSTGRES_USER=citebench          # optional, these are the defaults
#        POSTGRES_DB=citebench            # optional
#        GROQ_API_KEY=<your key>
#        VITE_API_URL=https://<api-domain>     # BAKED INTO THE WEB BUNDLE AT BUILD TIME
#        CORS_ORIGINS=https://<web-domain>
#   4. Domains tab, add two domains:
#        <web-domain> -> service "web", port 3000   (the reviewer entry point)
#        <api-domain> -> service "api", port 8000   (browser calls this directly)
#   5. Deploy, then seed the corpus from the API container (see infra/deploy/DOKPLOY.md).
#
# The api image bakes config.yaml, corpus, evals and the citebench package, so
# this file mounts NO host paths — only named volumes. That keeps it portable
# and avoids Dokploy's "host paths are cleaned up on deploy" trap, where a
# host bind mount that fails to resolve becomes an empty dir over the image.
#
# Note: VITE_API_URL is a build arg, so changing the API domain needs a rebuild.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citebench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citebench}
      POSTGRES_DB: ${POSTGRES_DB:-citebench}
    volumes:
      - citebench_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citebench} -d ${POSTGRES_DB:-citebench}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - default
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-citebench}:${POSTGRES_PASSWORD:-citebench}@db:5432/${POSTGRES_DB:-citebench}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CONFIG_PATH: /app/config.yaml
      CORPUS_DIR: /app/corpus
      PYTHONPATH: /repo
      TRACE_STORE_DIR: /tmp/citebench-traces
      EVAL_STORE_DIR: /app/evals/results
      REDTEAM_JSONL: /app/evals/redteam.jsonl
      NOMIC_CACHE_DIR: /tmp/nomic-embed
      FLASHRANK_CACHE_DIR: /tmp/flashrank
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      # Absolute path: the API's working dir is /app/apps/api, so a relative
      # manifest path would not resolve. Default is the 14-URL offline smoke
      # corpus, which is baked into the image and needs no network.
      # For the full 1,487-doc freeze set:
      #   CITEBENCH_MANIFEST=/app/corpus/MANIFEST.md
      #   CITEBENCH_SNAPSHOT_ONLY=0
      CITEBENCH_MANIFEST: ${CITEBENCH_MANIFEST:-/app/corpus/v0/MANIFEST.md}
      CITEBENCH_SNAPSHOT_ONLY: ${CITEBENCH_SNAPSHOT_ONLY:-1}
    volumes:
      - citebench_traces:/tmp/citebench-traces
      - citebench_nomic:/tmp/nomic-embed
      - citebench_flashrank:/tmp/flashrank
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # TEMPORARY no-Traefik fallback: publishes the API on the host so it is
    # reachable at http://<server-ip>:8081 without a reverse proxy. Remove these
    # two lines once Dokploy's Traefik is running and the domains work.
    ports:
      - "8081:8000"
    restart: unless-stopped
    networks:
      - default
      - dokploy-network

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      # Server-only origin for Nitro SSR reads (in-network Compose DNS).
      API_URL: http://api:8000
      # Public origin baked into the browser bundle at build time.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    expose:
      - "3000"
    # TEMPORARY no-Traefik fallback: the reviewer entry point becomes
    # http://<server-ip>:8080. Remove alongside the api ports block.
    ports:
      - "8080:3000"
    restart: unless-stopped
    networks:
      - default
      - dokploy-network

networks:
  default:
  # Dokploy's shared Traefik network, created by the Dokploy install. Every
  # service joins it explicitly: when Dokploy attaches a domain to a service it
  # rewrites that service's network list, and the other services would otherwise
  # fall off a shared network and lose `db` / `api` name resolution.
  dokploy-network:
    external: true

volumes:
  citebench_pgdata:
  citebench_traces:
  citebench_nomic:
  citebench_flashrank:
