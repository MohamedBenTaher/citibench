# Public-demo overlay. From the repo root:
#   docker compose -f docker-compose.yml -f infra/deploy/docker-compose.demo.yml up --build
# Web is the public origin (Playground + Evals). Caddy on :80 is optional.

services:
  api:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}

  proxy:
    image: caddy:2-alpine
    ports:
      - "${DEMO_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
